<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPV Admin | এমপিভি অ্যাডমিন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12332A;--paddy:#2E7D4F;--mist:#EAF1E7;--bone:#FAFBF7;--turmeric:#F2B02E;--clay:#B8432B;--line:#d4dfd0;--amber:#8a5a00;
--display:"Bricolage Grotesque","Hind Siliguri",system-ui,sans-serif;--body:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--body);color:var(--ink);background:#f3f6f1;line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
en,bn{display:inline}
html[lang="bn"] en{display:none}
html[lang="en"] bn{display:none}
html[lang="bn"] body{line-height:1.7}
h1,h2,h3{font-family:var(--display);line-height:1.2;letter-spacing:-.01em}
html[lang="bn"] h1,html[lang="bn"] h2,html[lang="bn"] h3{font-family:var(--body);letter-spacing:0;line-height:1.35}

/* layout */
.side{position:fixed;inset:0 auto 0 0;width:250px;background:var(--ink);color:#d7e4d8;z-index:50;overflow-y:auto;transform:translateX(-100%);transition:transform .2s;padding:14px 12px 30px}
.side.open{transform:none}
.brand{display:flex;gap:.6rem;align-items:center;color:#fff;font-family:var(--display);font-weight:700;padding:6px 8px 14px}
html[lang="bn"] .brand{font-family:var(--body)}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:.72rem;color:var(--turmeric)}
.sgroup{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7fa593;padding:14px 10px 4px}
html[lang="bn"] .sgroup{text-transform:none;letter-spacing:0;font-size:.82rem}
.side button.nav{display:flex;width:100%;align-items:center;gap:.65rem;border:0;background:none;color:inherit;text-align:left;padding:.5rem .7rem;border-radius:10px;min-height:42px;font-weight:500}
.side button.nav:hover{background:rgba(255,255,255,.08)}
.side button.nav[aria-current="page"]{background:var(--turmeric);color:var(--ink);font-weight:700}
.side .badge{margin-left:auto;background:var(--clay);color:#fff;border-radius:999px;font-size:.74rem;padding:0 .5rem;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(10,30,24,.5);z-index:45;display:none}
.scrim.open{display:block}
.top{position:sticky;top:0;z-index:30;background:rgba(243,246,241,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;gap:10px;padding:0 16px}
.burger{width:44px;height:44px;border:0;background:#fff;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;font-size:1.3rem}
.top h1{font-size:1.15rem;font-family:var(--body);font-weight:700}
.top .sp{margin-left:auto}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;font-size:.85rem;font-weight:700;padding:.15rem .7rem;min-height:34px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bone)}
.me{background:var(--mist);border-radius:999px;padding:.1rem .8rem;font-weight:700;font-size:.88rem}
main{padding:18px 16px 70px;max-width:1280px}
@media(min-width:1000px){.side{transform:none}.scrim{display:none!important}.burger{display:none}.wrapr{margin-left:250px}.top{padding:0 28px}main{padding:22px 28px 70px}}

/* ui */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.5rem 1.1rem;border-radius:999px;font-weight:700;border:2px solid transparent;min-height:42px;background:none;text-decoration:none;font-size:.95rem}
.btn-primary{background:var(--turmeric);color:var(--ink)}
.btn-primary:hover{background:#ffc247}
.btn-dark{background:var(--ink);color:var(--bone)}
.btn-line{border-color:var(--paddy);color:var(--paddy);background:#fff}
.btn-line:hover{background:var(--paddy);color:#fff}
.btn-danger{border-color:var(--clay);color:var(--clay);background:#fff}
.btn-danger:hover{background:var(--clay);color:#fff}
.btn-sm{min-height:36px;padding:.2rem .8rem;font-size:.88rem}
.ph{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h2{font-size:clamp(1.4rem,3.4vw,1.9rem)}
.ph p{color:#3e5e53;font-size:.95rem}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{font-size:1rem;font-family:var(--body);font-weight:700;margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}
@media(min-width:900px){.g2{grid-template-columns:1.2fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1180px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi .l{font-size:.84rem;color:#3e5e53;font-weight:600}
.kpi .v{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.2}
html[lang="bn"] .kpi .v{font-family:var(--body)}
.kpi .s{font-size:.8rem;color:#3e5e53}
.chip{display:inline-flex;align-items:center;font-size:.78rem;font-weight:700;border-radius:999px;padding:.02rem .6rem;background:var(--mist);white-space:nowrap}
.chip.ok{background:#d8efe0;color:#1d6a3a}.chip.watch{background:#fdeec8;color:var(--amber)}.chip.bad{background:#f8d9d1;color:#9a2f19}.chip.dark{background:var(--ink);color:var(--bone)}.chip.blue{background:#dbe8f5;color:#1f4f7a}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{border:1.5px solid var(--line);border-radius:12px;padding:.4rem .8rem;background:#fff;min-height:42px}
.toolbar input[type=search]{flex:1;min-width:180px;max-width:340px}
.toolbar .sp{margin-left:auto}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:680px;font-size:.93rem}
th{text-align:left;font-size:.78rem;color:#3e5e53;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:#f7faf5;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #e8efe5;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.thumb{width:44px;height:44px;border-radius:10px;background:radial-gradient(circle at 30% 30%,#f9dfb8,#e3a45b 62%,#c97f3a);flex:none;background-size:cover;background-position:center}
.cellrow{display:flex;gap:10px;align-items:center}
.sub{display:block;font-size:.8rem;color:#3e5e53}
.empty{text-align:center;padding:30px 10px;color:#3e5e53}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.15rem .85rem;font-weight:600;min-height:38px;font-size:.9rem}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.bar{height:8px;background:var(--mist);border-radius:999px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--paddy);border-radius:999px}
.alertrow{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #e8efe5;font-size:.93rem}
.alertrow:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;margin-right:8px}
.back{border:0;background:none;color:var(--paddy);font-weight:700;padding:4px 0;min-height:40px}
.profile{display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap;align-items:start}
.dl{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;font-size:.93rem;margin-top:6px}
.dl dt{color:#3e5e53}.dl dd{font-weight:600}
.legend{display:grid;gap:6px;margin-top:8px}
.legend div{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}

/* modal */
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,30,24,.55);display:none;overflow-y:auto;padding:4vh 12px}
.modal.open{display:block}
.mbox{background:#fff;border-radius:20px;max-width:640px;margin:0 auto;box-shadow:0 20px 50px -15px rgba(0,0,0,.4)}
.mbox.wide{max-width:820px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{font-size:1.1rem;font-family:var(--body);margin:0}
.x{width:40px;height:40px;border:0;background:var(--mist);border-radius:50%;font-size:1.2rem}
.mb{padding:16px 18px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.form{grid-template-columns:1fr 1fr}.form .full{grid-column:1/-1}}
label.f{display:grid;gap:4px;font-weight:600;font-size:.88rem;align-content:start}
label.f input:not([type=checkbox]):not([type=file]),label.f select,label.f textarea,.in{border:1.5px solid var(--line);border-radius:12px;padding:.5rem .8rem;background:#fff;min-height:46px;font-weight:400;width:100%;font-size:1rem}
label.f textarea{min-height:84px;resize:vertical}
label.f input:focus,label.f select:focus,label.f textarea:focus,.in:focus{border-color:var(--paddy);outline:none;box-shadow:0 0 0 3px rgba(46,125,79,.2)}
label.f.bad input,label.f.bad select,label.f.bad textarea{border-color:var(--clay)}
.err{color:var(--clay);font-size:.82rem;font-weight:600}
.tog{display:flex;gap:10px;align-items:center;font-weight:600;min-height:46px}
.tog input{width:22px;height:22px;accent-color:var(--paddy)}
.prev{width:100%;max-height:140px;object-fit:cover;border-radius:12px;display:none}
.hint{font-size:.85rem;color:#3e5e53}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:.55rem 1.2rem;font-weight:600;z-index:90;display:none}
.toast.show{display:block}
.ostep{display:flex;gap:4px;margin:6px 0 14px}
.ostep span{flex:1;text-align:center;font-size:.76rem;font-weight:700;padding:6px 2px;border-bottom:4px solid var(--line);color:#6a8a7e}
.ostep span.on{border-color:var(--turmeric);color:var(--ink)}.ostep span.dn{border-color:var(--paddy);color:var(--paddy)}
.inv-box{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:10px}
#print{display:none}
@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{display:block;position:absolute;left:0;top:0;width:100%;padding:24px;background:#fff;color:#000}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Course landing-page manager (frontend prototype; API-ready data shape) */
.cp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
.cp-stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.cp-stat strong{display:block;font-size:1.45rem;line-height:1.25}
.cp-stat span{font-size:.84rem;color:#62766a}
.cp-empty{background:#fff;border:1px dashed #b8c9b7;border-radius:16px;text-align:center;padding:34px 18px;margin-top:14px}
.cp-empty .cp-icon{font-size:2rem;margin-bottom:8px}
.cp-table-title{font-weight:700;display:block;max-width:360px}
.cp-slug{font-size:.8rem;color:#65776c;overflow-wrap:anywhere}
.cp-actions{display:flex;gap:6px;flex-wrap:wrap}
.cp-form-section{grid-column:1/-1;border-bottom:1px solid var(--line);padding:10px 0 5px;font-weight:700;color:var(--paddy)}
.cp-preview-hero{background:linear-gradient(135deg,#12332a,#2e7d4f);color:#fff;border-radius:16px;padding:26px;margin-bottom:16px}
.cp-preview-hero h2{font-size:1.6rem;margin:8px 0}.cp-preview-hero p{color:#e4eee4;max-width:700px}
.cp-preview-block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;margin:10px 0}
@media(max-width:620px){.cp-stats{grid-template-columns:1fr}.cp-actions .btn{flex:1}}

.trace-note{border:1px solid #d8e8dd;background:#f4faf6;color:#315b42;border-radius:12px;padding:12px 14px;font-size:.88rem;margin:10px 0 16px}
.trace-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.trace-step{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:.83rem;font-weight:650}.trace-step.active{background:#e9f5ed;border-color:#a9d2b7;color:#24633c}.trace-arrow{color:#789084}
.qr-preview{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;border:1px dashed #b8c9be;border-radius:14px;padding:14px;background:#fbfdfb}.qr-preview img{width:140px;height:140px;object-fit:contain;background:#fff;border-radius:8px}.passport-hero{background:linear-gradient(135deg,#e8f4eb,#f6f9f5);border-radius:16px;padding:18px;margin-bottom:14px}.passport-hero h2{margin:8px 0 4px}.timeline{border-left:2px solid #c7ddce;margin:12px 0 12px 7px;padding-left:18px}.timeline-item{position:relative;padding:0 0 15px}.timeline-item:before{content:"";position:absolute;left:-24px;top:4px;width:10px;height:10px;border-radius:50%;background:#2e7d4f;border:2px solid #fff;box-shadow:0 0 0 1px #9fc6ac}.trace-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.trace-stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.trace-stat strong{display:block;font-size:1.25rem}.trace-stat span{color:var(--muted);font-size:.8rem}@media(max-width:600px){.qr-preview{grid-template-columns:1fr}.trace-stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<aside class="side" id="side" aria-label="Admin menu"></aside>
<div class="scrim" id="scrim"></div>

<div class="wrapr">
  <header class="top">
    <button class="burger" type="button" id="burger" aria-label="Menu">☰</button>
    <h1 id="ptitle"></h1>
    <span class="sp"></span>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-set="en" aria-pressed="true">EN</button><button type="button" data-set="bn" aria-pressed="false">বাংলা</button></div>
    <span class="me"><en>Admin</en><bn>অ্যাডমিন</bn></span>
  </header>
  <main id="main" tabindex="-1"></main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<div id="print"></div>

<script>
(function(){
var html=document.documentElement;
function L(){return html.lang}
function t(en,bn){return L()==='bn'?bn:en}
function num(n,d){return Number(n).toLocaleString(L()==='bn'?'bn-BD':'en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function tk(n){return (n<0?'−':'')+'৳'+num(Math.abs(Math.round(n)))}
function crore(n){return n>=1e7?'৳'+num(n/1e7,2)+t(' Cr',' কোটি'):tk(n)}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function $(id){return document.getElementById(id)}
function toNum(s){s=String(s==null?'':s).replace(/[০-৯]/g,function(c){return '০১২৩৪৫৬৭৮৯'.indexOf(c)}).replace(/,/g,'').trim();var n=parseFloat(s);return isNaN(n)?0:n}
function pad(n,w){return String(n).padStart(w,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)}
function dstr(s){var d=typeof s==='string'?new Date(s+'T00:00:00'):s;return d.toLocaleDateString(L()==='bn'?'bn-BD':'en-GB',{day:'numeric',month:'short',year:'numeric'})}
var TODAY=new Date();TODAY.setHours(0,0,0,0);
function daysAgo(n){var d=new Date(TODAY);d.setDate(d.getDate()-n);return d}
function toast(m){var el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(function(){el.classList.remove('show')},2200)}

/* ================= place names ================= */
var BN_PLACE={Noakhali:'নোয়াখালী',Barishal:'বরিশাল',Feni:'ফেনী',Cumilla:'কুমিল্লা',Lakshmipur:'লক্ষ্মীপুর',Bhola:'ভোলা',Patuakhali:'পটুয়াখালী',Dhaka:'ঢাকা',Chattogram:'চট্টগ্রাম',Sylhet:'সিলেট',Khulna:'খুলনা',Rajshahi:'রাজশাহী',Rangpur:'রংপুর',Mymensingh:'ময়মনসিংহ',Sonaimuri:'সোনাইমুড়ী',Begumganj:'বেগমগঞ্জ',Companiganj:'কোম্পানীগঞ্জ',Subarnachar:'সুবর্ণচর',Bakerganj:'বাকেরগঞ্জ',Muladi:'মুলাদী',Gournadi:'গৌরনদী',Chhagalnaiya:'ছাগলনাইয়া',Sonagazi:'সোনাগাজী',Laksam:'লাকসাম',Chauddagram:'চৌদ্দগ্রাম',Ramganj:'রামগঞ্জ',Raipur:'রায়পুর','Char Fasson':'চরফ্যাশন',Kalapara:'কলাপাড়া'};
function place(s){return L()==='bn'?(BN_PLACE[s]||s):s}
var DIST=['Bagerhat','Bandarban','Barguna','Barishal','Bhola','Bogura','Brahmanbaria','Chandpur','Chapai Nawabganj','Chattogram','Chuadanga',"Cox's Bazar",'Cumilla','Dhaka','Dinajpur','Faridpur','Feni','Gaibandha','Gazipur','Gopalganj','Habiganj','Jamalpur','Jashore','Jhalokathi','Jhenaidah','Joypurhat','Khagrachhari','Khulna','Kishoreganj','Kurigram','Kushtia','Lakshmipur','Lalmonirhat','Madaripur','Magura','Manikganj','Meherpur','Moulvibazar','Munshiganj','Mymensingh','Naogaon','Narail','Narayanganj','Narsingdi','Natore','Netrokona','Nilphamari','Noakhali','Pabna','Panchagarh','Patuakhali','Pirojpur','Rajbari','Rajshahi','Rangamati','Rangpur','Satkhira','Shariatpur','Sherpur','Sirajganj','Sunamganj','Sylhet','Tangail','Thakurgaon'];

/* ================= SAMPLE DATA (replace with live database) ================= */
var DB={farmers:[],batches:[],trainings:[],regs:[],coursePages:[],categories:[],products:[],orders:[],coupons:[],notices:[],pubs:[],gallery:[],processingRecords:[],packages:[],farmVerifications:[]};
var SET={shopOpen:true,delivery:80,freeOver:2000,lowStock:10,pay:{bkash:true,nagad:true,rocket:true,bank:true,cod:true},bank:'Bank name, account name, account number and branch go here.'};

/* farmers + batches (totals match the brief’s example: 15 farmers, 169 batches, 353,400 kg, ৳6.36 crore) */
(function(){
  var PL=[['Noakhali','Sonaimuri'],['Noakhali','Begumganj'],['Noakhali','Companiganj'],['Barishal','Bakerganj'],['Barishal','Muladi'],['Barishal','Gournadi'],['Feni','Chhagalnaiya'],['Feni','Sonagazi'],['Cumilla','Laksam'],['Cumilla','Chauddagram'],['Lakshmipur','Ramganj'],['Lakshmipur','Raipur'],['Bhola','Char Fasson'],['Patuakhali','Kalapara'],['Noakhali','Subarnachar']];
  var BPF=[18,16,15,14,13,13,12,12,11,10,9,8,7,6,5],FCRT=[1.44,1.46,1.48,1.47,1.5,1.52,1.49,1.55,1.51,1.57,1.53,1.58,1.6,1.56,1.62],MORT=[1.6,1.8,1.9,2,2.1,2.2,2.4,2.3,2.6,2.8,2.5,3,2.9,3.4,3.1],MARG=[.22,.21,.2,.2,.19,.19,.18,.18,.17,.17,.16,.15,.15,.14,.13];
  var raw=0,tmp=[];
  for(var f=0;f<15;f++){

function barChart(data,w,h){
  var max=Math.max.apply(null,data.map(function(d){return d.v}))||1,W=600,H=210,pl=10,pb=26,pt=22,bw=(W-pl*2)/data.length;
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="'+t('Meat produced per month','মাসভিত্তিক মাংস উৎপাদন')+'">'+data.map(function(d,i){
    var bh=d.v/max*(H-pb-pt),x=pl+i*bw+bw*.15;
    return '<rect x="'+x.toFixed(1)+'" y="'+(H-pb-bh).toFixed(1)+'" width="'+(bw*.7).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="4" fill="#2E7D4F"/><text x="'+(x+bw*.35).toFixed(1)+'" y="'+(H-pb-bh-5).toFixed(1)+'" text-anchor="middle" font-size="10" fill="#3e5e53">'+num(Math.round(d.v/1000))+'k</text><text x="'+(x+bw*.35).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="#3e5e53">'+d.l+'</text>';
  }).join('')+'</svg>';
}

function stockModal(id){
  var p=prod(id);M={stock:id};
  openModal('<div class="mh"><h3>'+t('Adjust stock: ','স্টক সমন্বয়: ')+esc(t(p.en,p.bn))+'</h3><button class="x" type="button" data-close>×</button></div><div class="mb"><p>'+t('Current stock: ','বর্তমান স্টক: ')+'<strong>'+num(p.stock,p.stock%1?1:0)+t(' kg',' কেজি')+'</strong></p><div class="form" style="margin-top:10px"><label class="f"><span>'+t('Add (+) or remove (−) kg','যোগ (+) বা বাদ (−) কেজি')+'</span><input id="stDelta" inputmode="decimal" placeholder="+20 / -5"></label><label class="f"><span>'+t('Reason','কারণ')+'</span><select id="stWhy"><option>'+t('New stock from a batch','ব্যাচ থেকে নতুন স্টক')+'</option><option>'+t('Damaged or spoiled','নষ্ট বা পচে যাওয়া')+'</option><option>'+t('Count correction','গণনা সংশোধন')+'</option></select></label></div><p class="err" id="stErr"></p></div><div class="mf"><button class="btn btn-line" type="button" data-close>'+t('Cancel','বাতিল')+'</button><button class="btn btn-primary" type="button" id="stSave">'+t('Update stock','স্টক হালনাগাদ')+'</button></div>');
}
function orderModal(id){
  var o=DB.orders.filter(function(x){return x.id===id})[0];if(!o)return;M={order:id};
  var tot=orderTotals(o),flow=['pending','confirmed','processing','out','delivered'],idx=flow.indexOf(o.status),cancelled=o.status==='cancelled';
  var steps='<div class="ostep">'+flow.map(function(k,i){var s=STAT.filter(function(x){return x[0]===k})[0];return '<span class="'+(cancelled?'':(i<idx?'dn':i===idx?'on':''))+'">'+t(s[1],s[2])+'</span>'}).join('')+'</div>';
  var nextLbl=idx>-1&&idx<4?[t('Confirm order','অর্ডার নিশ্চিত করুন'),t('Start preparing','প্রস্তুত শুরু করুন'),t('Send out for delivery','ডেলিভারিতে পাঠান'),t('Mark delivered','পৌঁছেছে চিহ্নিত করুন')][idx]:'';
  var items=o.items.map(function(it){var p=prod(it.pid);return '<tr><td>'+esc(p?t(p.en,p.bn):it.pid)+'</td><td class="n">'+num(it.kg,it.kg%1?1:0)+t(' kg',' কেজি')+'</td><td class="n">'+tk(it.unit)+'</td><td class="n">'+tk(it.kg*it.unit)+'</td></tr>'}).join('');
  openModal('<div class="mh"><h3>'+esc(o.id)+' '+stLbl(o.status)+'</h3><button class="x" type="button" data-close aria-label="'+t('Close','বন্ধ')+'">×</button></div><div class="mb">'+(cancelled?'':steps)+
  '<div class="grid g2" style="gap:12px"><div class="inv-box" style="margin:0"><strong>'+t('Customer','ক্রেতা')+'</strong><dl class="dl"><dt>'+t('Name','নাম')+'</dt><dd>'+esc(o.cname)+'</dd><dt>'+t('Mobile','মোবাইল')+'</dt><dd>'+esc(o.mobile)+'</dd><dt>'+t('District','জেলা')+'</dt><dd>'+esc(place(o.district))+'</dd><dt>'+t('Address','ঠিকানা')+'</dt><dd>'+esc(o.address)+'</dd><dt>'+t('Date','তারিখ')+'</dt><dd>'+dstr(o.date)+'</dd></dl></div>'+
  '<div class="inv-box" style="margin:0"><strong>'+t('Payment','পেমেন্ট')+'</strong><dl class="dl"><dt>'+t('Method','পদ্ধতি')+'</dt><dd>'+esc(t(PAYL[o.method][0],PAYL[o.method][1]))+'</dd><dt>'+t('Status','অবস্থা')+'</dt><dd><span class="chip '+(o.paid?'ok':'watch')+'">'+(o.paid?t('Paid','পরিশোধিত'):t('Unpaid','অপরিশোধিত'))+'</span></dd></dl><button class="btn btn-line btn-sm" type="button" data-paidorder="'+o.id+'" style="margin-top:8px">'+(o.paid?t('Mark as unpaid','অপরিশোধিত করুন'):t('Mark as paid','পরিশোধিত করুন'))+'</button></div></div>'+
  '<div class="tw" style="margin-top:12px"><table style="min-width:420px"><thead><tr><th>'+t('Item','পণ্য')+'</th><th class="n">'+t('Qty','পরিমাণ')+'</th><th class="n">'+t('Price','দর')+'</th><th class="n">'+t('Amount','টাকা')+'</th></tr></thead><tbody>'+items+'<tr><td colspan="3" class="n">'+t('Subtotal','পণ্যের মোট')+'</td><td class="n">'+tk(tot.sub)+'</td></tr>'+(tot.disc?'<tr><td colspan="3" class="n">'+t('Discount','ছাড়')+'</td><td class="n">−'+tk(tot.disc)+'</td></tr>':'')+'<tr><td colspan="3" class="n">'+t('Delivery','ডেলিভারি')+'</td><td class="n">'+tk(tot.del)+'</td></tr><tr><td colspan="3" class="n"><strong>'+t('Total','সর্বমোট')+'</strong></td><td class="n"><strong>'+tk(tot.total)+'</strong></td></tr></tbody></table></div>'+
  '<label class="f" style="margin-top:12px"><span>'+t('Internal note','অভ্যন্তরীণ নোট')+'</span><textarea id="oNote">'+esc(o.note)+'</textarea></label></div>'+
  '<div class="mf"><button class="btn btn-line" type="button" data-invoice="'+o.id+'">'+t('Print invoice','ইনভয়েস প্রিন্ট')+'</button><button class="btn btn-line" type="button" data-savenote="'+o.id+'">'+t('Save note','নোট সংরক্ষণ')+'</button>'+(!cancelled&&o.status!=='delivered'?'<button class="btn btn-danger" type="button" data-cancel="'+o.id+'">'+t('Cancel order','অর্ডার বাতিল')+'</button>':'')+(nextLbl?'<button class="btn btn-primary" type="button" data-next="'+o.id+'">'+nextLbl+'</button>':'')+'</div>',true);
}
function invoice(id){
  var o=DB.orders.filter(function(x){return x.id===id})[0],tot=orderTotals(o);
  $('print').innerHTML='<h1 style="font-family:Arial;margin-bottom:4px">MPV Meat – '+t('Invoice','ইনভয়েস')+'</h1><p>'+esc(o.id)+' · '+dstr(o.date)+'</p><hr style="margin:12px 0"><p><strong>'+esc(o.cname)+'</strong><br>'+esc(o.mobile)+'<br>'+esc(o.address)+', '+esc(place(o.district))+'</p><table style="width:100%;border-collapse:collapse;margin-top:14px;font-size:14px"><tr style="text-align:left;border-bottom:1px solid #000"><th>'+t('Item','পণ্য')+'</th><th>'+t('Qty (kg)','পরিমাণ (কেজি)')+'</th><th>'+t('Price','দর')+'</th><th>'+t('Amount','টাকা')+'</th></tr>'+o.items.map(function(it){var p=prod(it.pid);return '<tr><td>'+esc(p?t(p.en,p.bn):it.pid)+'</td><td>'+it.kg+'</td><td>'+tk(it.unit)+'</td><td>'+tk(it.kg*it.unit)+'</td></tr>'}).join('')+'</table><p style="margin-top:12px;text-align:right">'+t('Subtotal','পণ্যের মোট')+': '+tk(tot.sub)+'<br>'+t('Discount','ছাড়')+': '+tk(tot.disc)+'<br>'+t('Delivery','ডেলিভারি')+': '+tk(tot.del)+'<br><strong>'+t('Total','সর্বমোট')+': '+tk(tot.total)+'</strong><br>'+t('Payment','পেমেন্ট')+': '+esc(t(PAYL[o.method][0],PAYL[o.method][1]))+' ('+(o.paid?t('Paid','পরিশোধিত'):t('Unpaid','অপরিশোধিত'))+')</p>';
  window.print();
}

/* ================= events ================= */
document.addEventListener('click',function(e){
  var el=e.target.closest('button');if(!el)return;var d=el.dataset;
  if(d.set){html.setAttribute('lang',d.set);document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.set===d.set?'true':'false')});closeModal();render();return}
  if(el.id==='burger'){openSide();return}
  if(d.cpadd){openCoursePageForm(null);return}
  if(d.cpedit){openCoursePageForm(d.cpedit);return}
  if(d.cppreview){previewCoursePage(d.cppreview);return}
  if(d.cptoggle){var cp=DB.coursePages.filter(function(x){return x.id===d.cptoggle})[0];if(cp){cp.status=cp.status==='published'?'draft':'published';cp.updatedAt=iso(TODAY);toast(cp.status==='published'?t('Page published in prototype','প্রোটোটাইপে পেজ প্রকাশিত'):t('Page unpublished','পেজ অপ্রকাশিত'));render()}return}
  if(d.cparchive){archiveCoursePage(d.cparchive);return}
  if(d.procadd){openProcessingForm();return}
  if(d.procview){processingPackages(d.procview);return}
  if(d.pkgview){publicPassportModal(d.pkgview);return}
  if(d.weight){editPackageWeight(d.weight);return}
  if(d.clearprocfilter!==undefined){S.packageProcessingFilter=null;render();return}
  if(d.qr){qrLabelModal(d.qr);return}
  if(d.pkgstatus){togglePackagePublish(d.pkgstatus);return}
  if(d.verifyadd){openVerificationForm(null);return}
  if(d.verifyedit){openVerificationForm(d.verifyedit);return}
  if(d.nav){var p=d.nav.split(':');go(p[0],p[1]);return}
  if(d.close!==undefined){closeModal();return}
  if(d.add){openForm(d.add,null,d.x);return}
  if(d.edit){var q=d.edit.split(':');openForm(q[0],DB[q[0]].filter(function(x){return x.id===q[1]})[0]);return}
  if(d.del){var w=d.del.split(':');confirmDel(w[0],w[1]);return}
  if(d.dodel){var z=d.dodel.split(':');doDel(z[0],z[1]);return}
  if(el.id==='mSave'){saveForm();return}
  if(el.id==='procSave'){saveProcessing();return}
  if(el.id==='verifySave'){saveVerification(el.dataset.id||'');return}
  if(el.id==='savePkgWeight'){var pw=packageFor(el.dataset.id),wg=Number($('pkgWeight').value);if(!wg||wg<1||!Number.isFinite(wg)){$('pkgWeightErr').textContent=t('Enter a valid positive weight in grams.','গ্রামে সঠিক ধনাত্মক ওজন লিখুন।');return}pw.weightG=Math.round(wg);closeModal();toast(t('Package weight updated in prototype','প্রোটোটাইপে প্যাকেজের ওজন আপডেট হয়েছে'));render();return}
  if(el.id==='printLabel'){printPackageLabel(el.dataset.id);return}
  if(el.id==='cpSave'){saveCoursePage();return}
  if(d.fa){F(S.view).a=d.fa;render();return}
  if(d.os){S.orderStatus=d.os;render();return}
  if(d.vis){var p2=prod(d.vis);p2.status=p2.status==='active'?'hidden':'active';toast(p2.status==='active'?t('Now visible in the shop','এখন দোকানে দেখা যাবে'):t('Hidden from the shop','দোকান থেকে লুকানো হয়েছে'));render();return}
  if(d.stock){stockModal(d.stock);return}
  if(el.id==='stSave'){var pr=prod(M.stock),dl=toNum($('stDelta').value);if(!dl){$('stErr').textContent=t('Enter a number such as 20 or -5.','২০ বা -৫ এর মতো সংখ্যা লিখুন।');return}if(pr.stock+dl<0){$('stErr').textContent=t('Stock cannot go below zero.','স্টক শূন্যের নিচে যেতে পারে না।');return}pr.stock=Math.round((pr.stock+dl)*100)/100;closeModal();toast(t('Stock updated','স্টক হালনাগাদ হয়েছে'));render();return}
  if(d.order){orderModal(d.order);return}
  if(d.next||d.cancel||d.paidorder||d.savenote||d.invoice){
    var id=d.next||d.cancel||d.paidorder||d.savenote||d.invoice,o=DB.orders.filter(function(x){return x.id===id})[0];
    if(d.next){var fl=['pending','confirmed','processing','out','delivered'];o.status=fl[fl.indexOf(o.status)+1];if(o.status==='delivered'&&o.method==='cod')o.paid=true;toast(t('Order updated','অর্ডার হালনাগাদ'));orderModal(id);render();return}
    if(d.cancel){o.status='cancelled';o.items.forEach(function(it){var p=prod(it.pid);if(p)p.stock=Math.round((p.stock+it.kg)*100)/100});toast(t('Order cancelled and stock returned','অর্ডার বাতিল, স্টক ফেরত'));orderModal(id);render();return}
    if(d.paidorder){o.paid=!o.paid;orderModal(id);render();return}
    if(d.savenote){o.note=$('oNote').value;toast(t('Note saved','নোট সংরক্ষিত'));return}
    if(d.invoice){invoice(id);return}
  }
  if(d.paid){DB.regs.filter(function(r){return r.id===d.paid})[0].pay='paid';toast(t('Marked as paid','পরিশোধিত চিহ্নিত'));render();return}
  if(d.rmreg){DB.regs=DB.regs.filter(function(r){return r.id!==d.rmreg});toast(t('Registration removed','নিবন্ধন সরানো হয়েছে'));render();return}
  if(el.id==='saveSet'){SET.shopOpen=$('sOpen').checked;SET.delivery=toNum($('sDel').value);SET.freeOver=toNum($('sFree').value);SET.lowStock=toNum($('sLow').value);Object.keys(PAYL).forEach(function(k){SET.pay[k]=$('sp_'+k).checked});SET.bank=$('sBank').value;toast(t('Settings saved','সেটিংস সংরক্ষিত'));return}
  if(d.csv){
    if(d.csv==='data'){var x=exportRows();download('mpv-'+EXP.ds+'-'+iso(TODAY)+'.csv',csv(x.h,x.r));toast(t('Downloading…','ডাউনলোড হচ্ছে…'))}
    else{var tid=d.csv.split(':')[1],rs=regsOf(tid).map(function(r){return [r.id,r.name,r.mobile,r.org,r.date,r.pay]});download('registrations-'+tid+'.csv',csv(['reg_id','name','mobile','organization','registered','payment'],rs))}
    return;
  }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.q){F(S.view).q=el.value;if(S.view==='passports'){render();var q=$('main').querySelector('[data-q]');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}return}var tb=$('tbl');if(tb){var fn=({farmers:tFarmers,products:tProducts,orders:tOrders})[S.view];if(fn)tb.innerHTML=fn()} }
});
document.addEventListener('change',function(e){
  var el=e.target,id=el.id||'';
  if(el.dataset&&(el.dataset.a||el.dataset.b)){var f=F(S.view);if(el.dataset.a)f.a=el.value;else f.b=el.value;var tb=$('tbl');if(tb)tb.innerHTML=({farmers:tFarmers,products:tProducts})[S.view]();return}
  if(id.indexOf('f_')===0&&el.type==='file'&&M&&M.ent){var k=id.slice(2);if(el.files&&el.files[0]&&el.accept.indexOf('image')>-1){var rd=new FileReader();rd.onload=function(){M.files[k]=rd.result;var pv=$('pv_'+k);if(pv){pv.src=rd.result;pv.style.display='block'}};rd.readAsDataURL(el.files[0])}return}
  if(id==='eDs'||id==='eDist'||id==='eFrom'||id==='eTo'||id==='eAnon'){EXP.ds=$('eDs').value;EXP.dist=$('eDist').value;EXP.from=$('eFrom').value;EXP.to=$('eTo').value;EXP.anon=$('eAnon').checked;$('ePrev').innerHTML=previewHTML()}
});
$('scrim').addEventListener('click',closeSide);
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();closeSide()}});
render();
})();
</script>
</body>
</html>
